name: chicks
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Поддержка нескольких языков (локализация)
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.5 # Иконки в стиле iOS
  flutter_svg: ^1.1.6 # Отображение SVG-картинок и иконок
  cached_network_image: ^3.2.3 # Загрузка и кэширование картинок из интернета
  flutter_animate: ^4.1.1 # Простые и красивые анимации для виджетов
  gap: ^3.0.1 # Виджет-отступ — замена SizedBox(height: 16) на Gap(16)
  logger: ^2.6.2

  # Управление состоянием
  bloc: ^8.1.4 # Бизнес-логика приложения (паттерн BLoC)
  flutter_bloc: ^8.1.6 # Виджеты для связи BLoC с интерфейсом

  # Firebase — серверная часть приложения
  firebase_core: ^2.30.0 # Ядро Firebase — нужно для работы всех Firebase-сервисов
  firebase_auth: ^4.19.2 # Авторизация пользователей (вход/регистрация)
  cloud_firestore: ^4.17.5 # База данных Firestore — хранение данных на сервере
  firebase_storage: ^11.7.7 # Хранение файлов в облаке (фото, документы)
  google_sign_in: ^6.2.1 # Вход через Google-аккаунт

  # Навигация
  go_router: ^10.2.0 # Роутер — переходы между экранами приложения

  # Формы
  flutter_form_builder: ^9.2.1 # Удобное создание форм (ввод данных)
  form_builder_validators: ^9.1.0 # Валидация полей формы (проверка введённых данных)

  # Утилиты
  equatable: ^2.0.5 # Удобное сравнение объектов (нужно для BLoC-состояний)
  intl: ^0.18.1 # Форматирование дат, чисел и валют
  flutter_dotenv: ^5.1.0 # Чтение секретов и настроек из .env файла
  shared_preferences: ^2.2.2 # Локальное хранилище (сохранить тему, язык, токен)
  connectivity_plus: ^4.0.2 # Проверка интернет-соединения
  url_launcher: ^6.2.5 # Открытие ссылок, email и телефона из приложения
  image_picker: ^1.0.7 # Выбор фото из галереи или камеры

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3 # Правила линтера — помогает писать чистый код

  # Генерация иконки и сплэш-экрана
  flutter_native_splash: ^2.4.7 # Экран загрузки при запуске приложения
  flutter_launcher_icons: ^0.14.4 # Генерация иконки приложения для Android и iOS

flutter:
  # Включаем автоматическую генерацию локализации из .arb файлов.
  # При каждом `flutter pub get` или `flutter run` Flutter проверит .arb файлы
  # и сгенерирует Dart-код для доступа к переводам.
  generate: true

  uses-material-design: true

  # Ассеты — картинки, иконки, SVG и другие файлы.
  assets:
    - assets/svg/
    - .env
