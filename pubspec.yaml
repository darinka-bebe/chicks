name: chicks
description: "Chicks — твой персональный стилист"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_dotenv: ^6.0.1
  http: ^1.2.1

  cupertino_icons: ^1.0.5
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  intl: ^0.20.2
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/svg/